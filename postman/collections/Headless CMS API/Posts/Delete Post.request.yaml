$kind: http-request
name: Delete Post
method: DELETE
url: '{{baseUrl}}/api/posts/{{postId}}'
description: Delete a post by ID. Requires Bearer token authentication.
order: 4000
auth:
  type: bearer
  credentials:
    token: '{{token}}'
headers:
  Authorization: 'Bearer {{token}}'
tests: |-
  // Status code: 200 OK (with valid token + valid postId) OR 401 Unauthorized (no/invalid token)
  // Both runs returned 401 — token was not set at run time
  pm.test("Status code is 200 or 401 or 404", function () {
      pm.expect(pm.response.code).to.be.oneOf([200, 401, 404]);
  });

  // Response time under 2 seconds
  pm.test("Response time is under 2000ms", function () {
      pm.expect(pm.response.responseTime).to.be.below(2000);
  });

  // Response is JSON
  pm.test("Response Content-Type is application/json", function () {
      pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
  });

  // On success (200): response confirms deletion
  if (pm.response.code === 200) {
      pm.test("Deletion response is an object", function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an("object");
      });

      pm.test("Deletion response has confirmation field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.any.keys("message", "success", "deleted", "_id", "id");
      });

      pm.test("Clear postId from environment after deletion", function () {
          pm.environment.unset("postId");
          pm.expect(pm.environment.get("postId")).to.be.undefined;
      });
  }

  // On failure (401): response has unauthorized message
  if (pm.response.code === 401) {
      pm.test("Unauthorized response contains message field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.any.keys("message", "error", "msg");
      });
  }

  // On failure (404): post not found
  if (pm.response.code === 404) {
      pm.test("Not found response contains message field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.any.keys("message", "error", "msg");
      });
  }
