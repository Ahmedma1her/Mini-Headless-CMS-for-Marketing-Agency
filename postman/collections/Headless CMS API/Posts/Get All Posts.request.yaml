$kind: http-request
name: Get All Posts
method: GET
url: '{{baseUrl}}/api/posts/all'
description: 'Retrieve all posts. No authentication required.'
order: 1000
tests: |-
  // Status code: 200 OK (expected when endpoint is working correctly)
  // Note: Both runs returned 400 — investigate if a query param or auth is required
  pm.test("Status code is 200 or 400", function () {
      pm.expect(pm.response.code).to.be.oneOf([200, 400]);
  });

  // Response time under 2 seconds
  pm.test("Response time is under 2000ms", function () {
      pm.expect(pm.response.responseTime).to.be.below(2000);
  });

  // Response is JSON
  pm.test("Response Content-Type is application/json", function () {
      pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
  });

  // On success (200): response is an array of posts
  if (pm.response.code === 200) {
      pm.test("Response is an array", function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an("array");
      });

      pm.test("Each post has required fields", function () {
          const json = pm.response.json();
          if (json.length > 0) {
              const post = json[0];
              pm.expect(post).to.have.any.keys("_id", "id");
              pm.expect(post).to.have.any.keys("title", "name");
          }
      });

      pm.test("Save first post ID to environment", function () {
          const json = pm.response.json();
          if (json.length > 0) {
              const postId = json[0]._id || json[0].id;
              pm.environment.set("postId", postId);
          }
      });
  }

  // On failure (400): response has error message
  if (pm.response.code === 400) {
      pm.test("Error response contains message field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.any.keys("message", "error", "msg");
      });
  }
