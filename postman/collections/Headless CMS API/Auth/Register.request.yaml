$kind: http-request
name: Register
method: POST
url: "{{baseUrl}}/api/users/register"
description: Register a new user account. Body requires username (3-10 chars),
  email, and password (8-20 chars).
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 400\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      pm.test(\"Body matches string\", function () {\r

      \    pm.expect(pm.response.text()).to.include(\"invalid \");\r

      });"
    language: text/javascript
order: 1000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "hossam",
      "email": "hossam@example.com",
      "password": "12345678"
    }
tests: |-
  // Status code: 201 Created (new user) OR 400 Bad Request (duplicate/validation)
  pm.test("Status code is 201 or 400", function () {
      pm.expect(pm.response.code).to.be.oneOf([201, 400]);
  });

  // Response time under 2 seconds
  pm.test("Response time is under 2000ms", function () {
      pm.expect(pm.response.responseTime).to.be.below(2000);
  });

  // Response is JSON
  pm.test("Response Content-Type is application/json", function () {
      pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
  });

  // On success (201): response has expected user fields
  if (pm.response.code === 201) {
      pm.test("Successful registration returns user object", function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an("object");
          pm.expect(json).to.have.any.keys("_id", "id", "username", "email", "token");
      });

      pm.test("Registered email matches request email", function () {
          const json = pm.response.json();
          if (json.email) {
              pm.expect(json.email).to.eql("maher@example.com");
          }
      });

      pm.test("Username matches request username", function () {
          const json = pm.response.json();
          if (json.username) {
              pm.expect(json.username).to.eql("maher");
          }
      });
  }

  // On failure (400): response has error message
  if (pm.response.code === 400) {
      pm.test("Error response contains message field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.any.keys("message", "error", "msg");
      });
  }
